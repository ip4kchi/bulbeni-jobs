<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Istanbul Districts | Bulbeni</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --navy: #102A43;
            --navy-dark: #0B2035;
            --blue: #176B87;
            --teal: #2A9D8F;
            --sky: #EAF6F8;
            --cream: #F8FAF9;
            --text: #132A3A;
            --muted: #647887;
            --border: #E2E9ED;
            --white: #FFFFFF;
            --district: #EAF6F8;
            --district-hover: #BFE5E0;
            --district-selected: #8FD1C8;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .site-header {
            height: 72px;
            background: rgba(255,255,255,.96);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .brand-logo {
            width: 112px;
            height: auto;
            display: block;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 15px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--white);
            color: var(--navy);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease;
        }

        .back-button:hover {
            background: var(--sky);
            border-color: #C8E2E7;
            color: var(--blue);
        }

        /* =========================================================
           PAGE INTRO
        ========================================================= */

        .intro {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: 52px 0 30px;
        }

        .intro-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .16em;
            color: var(--blue);
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: "Manrope", sans-serif;
            font-size: clamp(30px, 4vw, 48px);
            line-height: 1.05;
            letter-spacing: -.035em;
            color: var(--navy);
        }

        .intro p {
            max-width: 560px;
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================================================
           MAP CARD
        ========================================================= */

        .map-section {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto 70px;
        }

        .map-card {
            position: relative;
            overflow: hidden;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 14px 40px rgba(16,42,67,.06);
        }

        .map-toolbar {
            height: 58px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
        }

        .map-toolbar-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: .02em;
        }

        .map-toolbar-actions {
            display: flex;
            gap: 6px;
        }

        .map-control {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #FFFFFF;
            color: var(--navy);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease;
        }

        .map-control:hover {
            background: var(--sky);
            border-color: #C8E2E7;
            color: var(--blue);
        }

        .map-control.reset {
            width: auto;
            padding: 0 11px;
            font-size: 11px;
        }

        .map-stage {
            position: relative;
            height: 680px;
            background:
                radial-gradient(
                    circle at center,
                    #F7FCFC 0%,
                    #F0F8F8 65%,
                    #EAF4F5 100%
                );
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        .map-stage.dragging {
            cursor: grabbing;
        }

        #istanbul-map {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* =========================================================
           DISTRICTS
        ========================================================= */

        .district {
            fill: var(--district);
            stroke: #FFFFFF;
            stroke-width: 2;
            stroke-linejoin: round;
            cursor: pointer;
            transition:
                fill .18s ease,
                stroke .18s ease,
                filter .18s ease;
        }

        .district:hover {
            fill: var(--district-hover);
            stroke: var(--blue);
            stroke-width: 3;
            filter: drop-shadow(0 3px 5px rgba(23,107,135,.14));
        }

        .district.selected {
            fill: var(--district-selected);
            stroke: var(--blue);
            stroke-width: 3;
        }

        .district-label {
            pointer-events: none;
            fill: var(--navy);
            font-family: "DM Sans", sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .district-label.small {
            font-size: 11px;
        }

        .district-label.tiny {
            font-size: 9px;
        }

        /* =========================================================
           BOSPHORUS / WATER
        ========================================================= */

        .water {
            fill: #DDEFF2;
            opacity: .9;
            pointer-events: none;
        }

        .sea {
            fill: #E7F4F5;
            pointer-events: none;
        }

        /* =========================================================
           TOOLTIP
        ========================================================= */

        .tooltip {
            position: fixed;
            z-index: 20;
            pointer-events: none;
            padding: 8px 11px;
            border-radius: 8px;
            background: var(--navy);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 600;
            opacity: 0;
            transform: translate(10px, 10px);
            transition: opacity .12s ease;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(16,42,67,.18);
        }

        .tooltip.visible {
            opacity: 1;
        }

        /* =========================================================
           FOOTER
        ========================================================= */

        .site-footer {
            border-top: 1px solid var(--border);
            background: #FFFFFF;
            padding: 28px 0;
        }

        .footer-inner {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .footer-logo {
            width: 82px;
            height: auto;
        }

        .footer-inner p {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .header-inner,
            .intro,
            .map-section,
            .footer-inner {
                width: min(100% - 24px, 1200px);
            }

            .intro {
                padding-top: 38px;
            }

            .map-stage {
                height: 560px;
            }

            .map-toolbar {
                padding: 0 10px;
            }

            .map-toolbar-title {
                font-size: 11px;
            }

            .district-label {
                font-size: 10px;
            }

            .district-label.small {
                font-size: 9px;
            }

            .district-label.tiny {
                font-size: 8px;
            }

            .footer-inner {
                flex-direction: column;
                align-items: flex-start;
            }
        }

    </style>
</head>

<script>

    const svg = document.getElementById("istanbul-map");
    const stage = document.getElementById("map-stage");
    const tooltip = document.getElementById("tooltip");

    const districts = [
        ...document.querySelectorAll(".district")
    ];

    const initialViewBox = {
        x: 0,
        y: 0,
        width: 1200,
        height: 700
    };

    let viewBox = {
        ...initialViewBox
    };

    let selectedDistrict = null;

    let dragging = false;
    let dragStart = null;
    let dragViewBox = null;


    /* =========================================================
       VIEWBOX
    ========================================================= */

    function updateViewBox() {

        svg.setAttribute(
            "viewBox",
            `${viewBox.x} ${viewBox.y} ${viewBox.width} ${viewBox.height}`
        );

    }


    function resetMap() {

        viewBox = {
            ...initialViewBox
        };

        selectedDistrict = null;

        districts.forEach(
            district => district.classList.remove("selected")
        );

        updateViewBox();

    }


    function zoom(factor) {

        const centerX =
            viewBox.x + viewBox.width / 2;

        const centerY =
            viewBox.y + viewBox.height / 2;

        const newWidth =
            viewBox.width * factor;

        const newHeight =
            viewBox.height * factor;

        viewBox = {
            x: centerX - newWidth / 2,
            y: centerY - newHeight / 2,
            width: newWidth,
            height: newHeight
        };

        clampViewBox();

        updateViewBox();

    }


    function clampViewBox() {

        const minimumWidth = 350;
        const maximumWidth = 1200;

        viewBox.width =
            Math.max(
                minimumWidth,
                Math.min(maximumWidth, viewBox.width)
            );

        viewBox.height =
            Math.max(
                minimumWidth * (700 / 1200),
                Math.min(700, viewBox.height)
            );

        if (viewBox.x < 0) {
            viewBox.x = 0;
        }

        if (viewBox.y < 0) {
            viewBox.y = 0;
        }

        if (viewBox.x + viewBox.width > 1200) {
            viewBox.x =
                1200 - viewBox.width;
        }

        if (viewBox.y + viewBox.height > 700) {
            viewBox.y =
                700 - viewBox.height;
        }

    }


    function zoomToDistrict(district) {

        const box = district.getBBox();

        const padding = 55;

        let width =
            box.width + padding * 2;

        let height =
            box.height + padding * 2;

        const ratio =
            1200 / 700;

        if (width / height > ratio) {
            height = width / ratio;
        } else {
            width = height * ratio;
        }

        let x =
            box.x + box.width / 2 - width / 2;

        let y =
            box.y + box.height / 2 - height / 2;

        if (x < 0) x = 0;
        if (y < 0) y = 0;

        if (x + width > 1200) {
            x = 1200 - width;
        }

        if (y + height > 700) {
            y = 700 - height;
        }

        viewBox = {
            x,
            y,
            width,
            height
        };

        selectedDistrict = district;

        districts.forEach(
            item => item.classList.remove("selected")
        );

        district.classList.add("selected");

        updateViewBox();

    }


    /* =========================================================
       TOOLTIP
    ========================================================= */

    function showTooltip(event, name) {

        tooltip.textContent = name;

        tooltip.style.left =
            `${event.clientX}px`;

        tooltip.style.top =
            `${event.clientY}px`;

        tooltip.classList.add("visible");

    }


    function moveTooltip(event) {

        tooltip.style.left =
            `${event.clientX}px`;

        tooltip.style.top =
            `${event.clientY}px`;

    }


    function hideTooltip() {

        tooltip.classList.remove("visible");

    }


    /* =========================================================
       DISTRICT EVENTS
    ========================================================= */

    districts.forEach(
        district => {

            const name =
                district.dataset.name;

            district.addEventListener(
                "mouseenter",
                event => {
                    showTooltip(event, name);
                }
            );

            district.addEventListener(
                "mousemove",
                moveTooltip
            );

            district.addEventListener(
                "mouseleave",
                hideTooltip
            );

            district.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    zoomToDistrict(district);

                }
            );

        }
    );


    /* =========================================================
       ZOOM CONTROLS
    ========================================================= */

    document
        .getElementById("zoom-in")
        .addEventListener(
            "click",
            () => zoom(.75)
        );

    document
        .getElementById("zoom-out")
        .addEventListener(
            "click",
            () => zoom(1.33)
        );

    document
        .getElementById("reset-map")
        .addEventListener(
            "click",
            resetMap
        );


    /* =========================================================
       DRAG / PAN
    ========================================================= */

    stage.addEventListener(
        "pointerdown",
        event => {

            if (
                event.target.classList.contains("district")
            ) {
                return;
            }

            dragging = true;

            stage.classList.add("dragging");

            dragStart = {
                x: event.clientX,
                y: event.clientY
            };

            dragViewBox = {
                ...viewBox
            };

            stage.setPointerCapture(
                event.pointerId
            );

        }
    );


    stage.addEventListener(
        "pointermove",
        event => {

            if (!dragging) {
                return;
            }

            const rect =
                stage.getBoundingClientRect();

            const scaleX =
                viewBox.width / rect.width;

            const scaleY =
                viewBox.height / rect.height;

            const dx =
                (event.clientX - dragStart.x) * scaleX;

            const dy =
                (event.clientY - dragStart.y) * scaleY;

            viewBox.x =
                dragViewBox.x - dx;

            viewBox.y =
                dragViewBox.y - dy;

            clampViewBox();

            updateViewBox();

        }
    );


    function stopDragging(event) {

        if (!dragging) {
            return;
        }

        dragging = false;

        stage.classList.remove("dragging");

        try {
            stage.releasePointerCapture(
                event.pointerId
            );
        } catch (_) {}

    }


    stage.addEventListener(
        "pointerup",
        stopDragging
    );

    stage.addEventListener(
        "pointercancel",
        stopDragging
    );


    /* =========================================================
       DOUBLE CLICK = RESET
    ========================================================= */

    stage.addEventListener(
        "dblclick",
        event => {

            if (
                event.target.classList.contains("district")
            ) {
                return;
            }

            resetMap();

        }
    );


    /* =========================================================
       INITIAL STATE
    ========================================================= */

    updateViewBox();

</script>

</body>
</html>
